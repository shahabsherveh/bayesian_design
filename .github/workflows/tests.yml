name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the package and its dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # CPU-only JAX keeps the job from pulling CUDA wheels.
          python -m pip install "jax[cpu]"

      - name: Show the resolved environment
        run: python -m pip list

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          ruff check src/ tests/ experiments/

      - name: Type check with ty
        run: |
          python -m pip install ty
          # src/ only: tests/ and experiments/ import sibling scripts via sys.path and
          # carry Optional-narrowing patterns ty cannot follow, which is not worth
          # annotating away. --exit-zero-on-warning means only error-level diagnostics
          # fail the job; the 70 pre-existing warnings do not.
          ty check src/ --exit-zero-on-warning

      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        # The suite is not a smoke test: JAX recompiles per problem construction, so the
        # slowest tests take minutes. Run it across cores rather than weakening the
        # assertions. Serial runtime is roughly 13 minutes; -n auto brings that under 5.
        run: python -m pytest tests/ -q -n auto
