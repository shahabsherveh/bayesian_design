name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast gates. These also run locally before every commit via .pre-commit-config.yaml,
  # so this job is a backstop for commits made with --no-verify and for pull requests
  # from contributors who have not installed the hook.
  #
  # It checks formatting/style and prose only. Type checking lives in the `test` job
  # because ty must resolve numpy/jax/flax to be meaningful.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the lint tooling
        # Only the linters, not the full scientific stack: this job should finish in
        # seconds. All three are pinned in requirements-dev.txt, and the same versions
        # are used by the pre-commit hooks.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff ty pymarkdownlnt

      - name: ruff
        # --check: fail rather than rewrite, so CI reports the drift instead of fixing it
        # behind the reviewer's back. Run `ruff format` locally to apply.
        run: |
          ruff format --check src/ tests/ experiments/
          ruff check src/ tests/ experiments/

      - name: pymarkdown
        # --config is required: pymarkdown does not otherwise pick up the project file.
        run: pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')

      # NOTE: ty deliberately does not run in this job. Type checking src/ needs the
      # project's dependencies importable (numpy, jax, flax, scipy, ...); without them
      # ty reports every import as unresolved and the check is meaningless. Installing
      # that stack here would turn a seconds-long job into a multi-minute download, so
      # ty runs in the `test` job below, which installs the environment anyway.

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      # Only run the (multi-minute) suite when the change could affect it. Docs,
      # config, and meta changes do not exercise library or experiment code, so
      # the job is skipped for them. The lint job above still runs on every PR.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'experiments/**'
              - 'conftest.py'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'requirements-dev.txt'

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the package and its dependencies
        if: steps.changes.outputs.code == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # Dev tooling (pytest, pytest-xdist) is a separate extra to keep the runtime
          # dependency set minimal; it also brings in the linters for a future audit job.
          python -m pip install -r requirements-dev.txt
          # CPU-only JAX keeps the job from pulling CUDA wheels.
          python -m pip install "jax[cpu]"

      - name: Show the resolved environment
        if: steps.changes.outputs.code == 'true'
        run: python -m pip list

      - name: ty
        if: steps.changes.outputs.code == 'true'
        # src/ only: tests/ and experiments/ import sibling scripts via sys.path and
        # carry Optional-narrowing patterns ty cannot follow. src/ has zero diagnostics
        # and pyproject.toml sets terminal.error-on-warning, so any new diagnostic of any
        # severity fails this step. It runs here rather than in the lint job because ty
        # needs the dependencies importable (see the note in that job).
        run: ty check src/

      - name: Run the test suite
        if: steps.changes.outputs.code == 'true'
        env:
          MPLBACKEND: Agg
        # The suite is not a smoke test: JAX recompiles per problem construction, so the
        # slowest tests take minutes. Run it across cores rather than weakening the
        # assertions. Serial runtime is roughly 13 minutes; -n auto brings that under 5.
        run: python -m pytest tests/ -q -n auto
