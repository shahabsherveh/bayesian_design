name: autofix

# Manual only. Deliberately not triggered by push, because a workflow that writes to the
# repository and is also triggered by pushes can loop.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to fix
        required: true
        default: main
      open_pr:
        description: Push to a new autofix/* branch and open a PR instead of committing directly
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autofix-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # A real token so the push is not attributed to the default GITHUB_TOKEN, which
          # cannot re-trigger workflows. Falls back automatically when the secret is unset.
          token: ${{ secrets.AUTOFIX_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff ty pymarkdownlnt

      # Only the tools with a working fix mode are run here. ty 0.0.104 cannot rewrite
      # type errors (verified: --fix reports "0 fixed" even for an invalid assignment),
      # so it stays a read-only gate in tests.yml rather than pretending to fix.
      - name: Apply ruff fixes
        run: ruff check src/ tests/ experiments/ --fix

      - name: Apply pymarkdown fixes
        # Same file set as the scan in tests.yml, so a new markdown file cannot escape.
        run: pymarkdown --config .pymarkdown.json fix $(git ls-files '*.md')

      - name: Show what changed
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to fix." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
            {
              echo "### Autofix changes"
              echo '```diff'
              git --no-pager diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Re-run the gates on the fixed tree. A fixer that breaks something is worse than
      # no fixer, so this must pass before anything is pushed.
      - name: Verify the fixed tree still passes
        if: steps.diff.outputs.changed == 'true'
        run: |
          ruff check src/ tests/ experiments/
          pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')
          ty check src/ --exit-zero-on-warning

      - name: Commit to a new branch and open a PR
        if: steps.diff.outputs.changed == 'true' && inputs.open_pr
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_TOKEN || secrets.GITHUB_TOKEN }}
          # env rather than inline interpolation, so a crafted branch name cannot inject
          # shell metacharacters.
          BASE_REF: ${{ inputs.ref }}
        run: |
          branch="autofix/${BASE_REF//\//-}-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "style: apply automated lint fixes"
          git push origin "$branch"
          gh pr create \
            --base "$BASE_REF" \
            --head "$branch" \
            --title "style: apply automated lint fixes" \
            --body "Generated by the \`autofix\` workflow. Only ruff and pymarkdown changes are included; ty has no working fix mode and is left alone. The fixed tree was re-checked before this PR was opened."

      - name: Commit directly to the branch
        if: steps.diff.outputs.changed == 'true' && !inputs.open_pr
        env:
          BASE_REF: ${{ inputs.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: apply automated lint fixes"
          git push origin "HEAD:${BASE_REF}"
