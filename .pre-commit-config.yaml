# Fast checks that run before every commit. The full test suite is deliberately not
# here: it takes about 5 minutes even with -n auto, which is too slow to sit in front of
# a commit. CI runs it on push instead (see .github/workflows/tests.yml).
#
# Install once per clone:
#   python -m pip install pre-commit && pre-commit install
#
# Run manually against everything:
#   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        # Refuse to commit directly to main (this hook also protects master by
        # default). Feature work goes on a branch and is merged back via PR.
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-format
        # Enforces the formatting so the tree cannot drift back to mixed style after
        # the one-off reformat. Fails (rather than rewriting) so a commit never silently
        # changes files; run `ruff format` to apply.
        files: ^(src|tests|experiments)/.*\.py$
      - id: ruff-check
        # The rule set lives in pyproject.toml; no --fix here, so a commit cannot
        # silently rewrite the working tree.
        args: []
        files: ^(src|tests|experiments)/.*\.py$

  - repo: local
    hooks:
      - id: pymarkdown
        name: pymarkdown
        # --config is required: pymarkdown does not otherwise pick up the project file.
        # Line length (MD013) is disabled there, matching the ruff E501 decision.
        entry: pymarkdown --config .pymarkdown.json scan
        language: system
        types: [markdown]

      - id: ty
        name: ty check src/
        # ty is installed with the project dev tooling (see requirements-dev.txt), so
        # this runs the same version as CI rather than whatever happens to be on PATH.
        # No --exit-zero-on-warning: pyproject.toml sets terminal.error-on-warning, and
        # src/ has zero diagnostics, so any new one of any severity fails the hook.
        entry: ty check src/
        language: system
        types: [python]
        # ty needs the whole src/ tree to resolve cross-module imports, so it is run as
        # a project-wide check rather than per-file.
        pass_filenames: false
        files: ^src/.*\.py$
