[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "bed"
version = "0.0.1"
authors = [
  { name="Shahab Sherveh", email="shahab.sherveh.0781@student.uu.se" },
]
description = "A Bayesian experimental design library."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dynamic = ["dependencies"]

[project.scripts]
bed = "bed.cli.main:app"

[project.urls]
Homepage = "https://github.com/shahabsherveh/bayesian_design"
[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }
[tool.pytest.ini_options]
testpaths = [
  "tests"
]
addopts = "-s"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Correctness, plus the mechanical cleanups that carry no behaviour change. This is a research
# codebase written in a deliberately dense style (compact statements, long lines, semicolons),
# so the heavy stylistic rule sets stay off rather than mass-reformatting the analysis code.
select = [
  "E4",     # duplicate names in imports
  "E7",     # statement-level mistakes (redefinition, comparison abuse)
  "E9",     # syntax/runtime errors
  "F",      # pyflakes: unused imports/variables, undefined names
  "W6",     # invalid escape sequences
  "PLE",    # pylint: errors only
  "PIE790", # redundant pass
  "RUF046", # redundant int() around a length
  "RUF022", # unsorted __all__
  "I001",   # unsorted / unsplit imports
]
ignore = [
  "E401",  # multiple imports on one line — compact style used throughout
  "E402",  # imports after code — deliberate in the experiment scripts
  "E501",  # line length — the codebase uses long lines by design
  "E701",  # multiple statements on one line (colon)
  "E702",  # multiple statements on one line (semicolon)
  "E731",  # lambda assignment
  "E741",  # ambiguous variable name (l, I, O)
]
