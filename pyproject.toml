[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "bed"
version = "0.0.1"
authors = [
  { name="Shahab Sherveh", email="shahab.sherveh.0781@student.uu.se" },
]
description = "A Bayesian experimental design library."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dynamic = ["dependencies"]

[project.scripts]
bed = "bed.cli.main:app"

[project.urls]
Homepage = "https://github.com/shahabsherveh/bayesian_design"
[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }
[tool.pytest.ini_options]
testpaths = [
  "tests"
]
addopts = "-s"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Correctness, plus the stylistic rules the tree is now actually formatted to.
# `ruff format` is enforced separately (pre-commit + CI), so E501/E7 are only linted
# where they can genuinely be honoured.
select = [
  "E4",     # duplicate names in imports
  "E7",     # statement-level mistakes (redefinition, comparison abuse)
  "E9",     # syntax/runtime errors
  "F",      # pyflakes: unused imports/variables, undefined names
  "W6",     # invalid escape sequences
  "PLE",    # pylint: errors only
  "PIE790", # redundant pass
  "RUF046", # redundant int() around a length
  "RUF022", # unsorted __all__
  "I001",   # unsorted / unsplit imports
  "E501",   # line length (honoured; the analysis scripts relax it below)
  "E701",   # multiple statements on one line (colon)
  "E702",   # multiple statements on one line (semicolon)
  "E731",   # lambda assignment
  "E741",   # ambiguous variable name (l, I, O)
  "E401",   # multiple imports on one line
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The investigation scripts set process-wide state before importing the library
# (`jax.config.update("jax_enable_x64", True)` must precede the bed imports or x64 does
# not apply), and format long tabular result lines as single strings. Both are deliberate
# and cannot be fixed without changing behaviour or hurting readability.
"experiments/**" = ["E402", "E501"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
# TensorFlow is imported lazily inside get_mnist_data and is optional for the synthetic
# experiments (it is not installed in the standard dev environment), so an unresolvable
# import of it is expected rather than a defect. Suppressing it by module name is
# narrower than downgrading the whole import-not-found rule.
allowed-unresolved-imports = ["tensorflow", "tensorflow_datasets"]

[tool.ty.rules]
# Every rule stays at its default severity. Left explicit so it is obvious that the gate
# is not downgrading anything: a new diagnostic of any severity fails the check below.

[tool.ty.terminal]
# Warnings fail the gate. Without this, ty exits 0 when the only diagnostics are
# warnings, which is how the previous ~70-warning baseline stayed green.
error-on-warning = true
