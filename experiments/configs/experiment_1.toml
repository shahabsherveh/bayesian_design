[runtime]
x64 = true

[model]
type = "LinearNN"
input_dim = 400
seed = 0

[truth]
enabled = true
seed = 1234
scale = 1.0
bias = 0.0

[data]
kind = "synthetic"
num_train = 90
num_test = 10
input_dim = 400
embedding_dim = 50
embedding_noise_std = 0.01
measurement_noise_std = 1.0
var = 2.0
seed = 0

[latent_cov]
type = "scaled_identity"
scale = 0.1

[measurement_error]
variance = 1.0
dim = 1

[experiment]
filter_type = "ekf"
latent_innovation = 0
plot_inter_results = true
pre_train_model = false

[training]
learning_rate = 0.01
epochs = 50
seed = 0

[run]
strategies = ["EPIG", "EIG", "EPIG-MC", "RAND"]
iterations = 100
optimizer_method = "brute_force"

[run.optimizer_params]
num_samples = 400
