
[runtime]
x64 = true

[model]
type = "DNN"
seed = 0
input_dim = 1
hidden_dims = [16,16]
output_dim = 1

[data]
kind = "1d_regression"
[data.outcome_model]
type="DNN"
seed=0
input_dim=1
hidden_dims=[21]
output_dim=1
activation='tanh'


[latent_cov]
type = "he_diagonal"
scale = 2

[measurement_error]
variance = 0.01
dim = 1

[experiment]
filter_type = ["ukf", "ekf"]
filter_params=[{alpha=10},{}]
latent_innovation = 0.1
pre_train_model = false

[training]
learning_rate = 0.05
epochs = 200
seed = 0

[run]
strategies = ["EPIG", "EIG"]
iterations = 40
optimizer_method = "brute_force"
warm_start = 10
