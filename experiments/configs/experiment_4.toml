
[runtime]
x64 = true

[model]
type = "DNN"
seed = 0
input_dim = 8
hidden_dims = [8,8]
output_dim = 1

[data]
kind = "uci"
name = "Concrete Compressive Strength"
test_size = 0.2

[latent_cov]
type = "he_diagonal"
kernel_scale = 2

[measurement_error]
variance = 0.01
dim = 1

[experiment]
filter_type = ["ukf", "ekf"]
filter_params=[{alpha=10},{}]
latent_innovation = 0
pre_train_model = false

[training]
learning_rate = 0.05
epochs = 200
seed = 0

[run]
strategies = ["EPIG", "EIG"]
iterations = 190
optimizer_method = "brute_force"
warm_start = 10
